<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <title>Лихтер-техник · Тест</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=kit-20261019-1" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="app-shell">
    <div style="border:1px solid #b2863c;background:#302618;color:#ffe3a6;padding:10px 12px;border-radius:12px;margin-bottom:12px;text-align:center;font-size:12px;font-weight:600">ТЕСТОВАЯ ВЕРСИЯ · @Likhtertestbot</div>
    <header class="topbar" style="min-height:72px">
      <button id="backBtn" class="icon-btn hidden" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="brand" id="brandHome" style="display:flex;align-items:center">
        <img
          src="./logo-likhter.png"
          alt="Лихтер-студия"
          style="display:block;width:82px;height:auto;max-height:64px;object-fit:contain"
        >
      </div>
      <button id="citySwitch" class="city-switch hidden" aria-label="Выбрать другой город"></button>
    </header>

    <section class="hero" style="padding-top:14px">
      <h1 id="screenTitle">Лихтер-техник</h1>
    </section>

    <section class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" />
    </section>

    <section id="screen" class="screen"></section>
  </main>

  <template id="homeTemplate">
    <div class="grid home-grid">
      <button class="card nav-card" data-route="groups">
        <div class="icon-badge">◫</div>
        <div class="card-copy"><h3>Группы</h3><p>Оборудование, stage plan, костюмы</p></div>
        <span class="chev">›</span>
      </button>
      <button class="card nav-card" data-route="standards">
        <div class="icon-badge">≋</div>
        <div class="card-copy"><h3>Стандарты</h3><p>Регламенты, чек-листы, инструкции</p></div>
        <span class="chev">›</span>
      </button>
      <button class="card nav-card" data-route="repair">
        <div class="icon-badge">⌁</div>
        <div class="card-copy"><h3>Ремонт</h3><p>Диагностика и решения</p></div>
        <span class="chev">›</span>
      </button>
      <button class="card nav-card" data-route="venues">
        <div class="icon-badge">⌂</div>
        <div class="card-copy"><h3>Площадки</h3><p>Залы, звук, занос, особенности</p></div>
        <span class="chev">›</span>
      </button>
    </div>
  </template>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js?v=repair-costumes-20261020"></script>
</body>
</html>
